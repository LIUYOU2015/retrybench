[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retrybench"
version = "0.2.0"
description = "A conformance benchmark for safe recovery from ambiguous tool outcomes in LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{name = "RetryBench contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.scripts]
retrybench = "retrybench.cli:main"

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.281"]
openai = ["inspect-ai==0.3.281", "openai==3.35.1"]
anthropic = ["inspect-ai==0.3.281", "anthropic==1.15.0"]
langgraph = ["langgraph==0.6.11"]
langchain = ["langchain-core==0.3.86"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
retrybench = ["data/*.json"]
