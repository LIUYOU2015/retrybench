name: Cross-model evaluation and evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts
      - run: git diff --check
      - name: Verify the distributed evidence without inference
        run: |
          python -c "import zipfile; zipfile.ZipFile('artifacts/cross-model-v1.zip').extractall('/tmp/retrybench-evidence')"
          python /tmp/retrybench-evidence/verify.py
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[inspect]'
      - run: python -m unittest discover -s tests -p test_inspect_adapter.py -v
